name: 🐛 Bug Report
description: Report a reproducible bug or issue in TokenSafe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: TokenSafe Version
      placeholder: e.g. 1.3.11 (`tokensafe --version`)
    validations:
      required: true
  - type: dropdown
    id: agent_environment
    attributes:
      label: AI Coding Agent / Editor
      options:
        - Cursor
        - Claude Desktop
        - Google Antigravity
        - Windsurf
        - Cline
        - Other (specify in description)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `npx tokensafe`
        2. Execute command...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      render: shell
