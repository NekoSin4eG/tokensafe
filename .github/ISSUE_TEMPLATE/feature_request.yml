name: ✨ Feature Request
description: Suggest an idea, optimization, or enhancement for TokenSafe
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make TokenSafe better!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or token inefficiency? (e.g. "I'm always frustrated when...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe how you envision this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
