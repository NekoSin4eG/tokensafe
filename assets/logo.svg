<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="128" y1="60" x2="128" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Tech Orbitals -->
  <circle cx="128" cy="128" r="92" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="128" cy="128" r="64" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Outer Protective Vault Shield -->
  <path d="M128 38 L196 66 V128 C196 172 167 208 128 222 C89 208 60 172 60 128 V66 L128 38 Z"
        stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" fill="#080D1A" fill-opacity="0.9" filter="url(#softGlow)"/>

  <!-- Inner Cyber Vault Hexagon Core -->
  <path d="M128 62 L178 82 V128 C178 158 156 186 128 198 C100 186 78 158 78 128 V82 L128 62 Z"
        fill="url(#shieldGrad)" fill-opacity="0.12" stroke="url(#shieldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Central High-Velocity Lightning Compression Bolt -->
  <path d="M136 72 L96 132 H126 L120 184 L160 124 H130 L136 72 Z"
        fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Energy Pulse Dots / Token Orbitals -->
  <circle cx="128" cy="40" r="3.5" fill="#34D399"/>
  <circle cx="196" cy="128" r="3.5" fill="#22D3EE"/>
  <circle cx="60" cy="128" r="3.5" fill="#22D3EE"/>
  <circle cx="128" cy="220" r="3.5" fill="#10B981"/>
</svg>